name: "Auto-Publish Grow Guide"

on:
  schedule:
    - cron: "0 14 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate article
        run: node scripts/generate-article.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "MasterGrowbot Bot"
          git config user.email "bot@mastergrowbot.com"
          git add -A
          git diff --staged --quiet || (git commit -m "content: auto-publish grow guide" && git push)
